<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derivate works by SeeraLVT</title>
    <style>
        * {
            margin: 0;
            padding: 0; 
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.4;
        }

        
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        
        header {
            border-bottom: 1px solid #2a2a2a;
            padding: 32px 0;
            margin-bottom: 48px;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: #fff;
            text-decoration: none;
        }

        .nav {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .nav a:hover {
            color: #fff;
        }

        .lang-switch {
            display: flex;
            gap: 8px;
            margin-left: 8px;
        }

        .lang-btn {
            background: none;
            border: 1px solid #3a3a3a;
            color: #a0a0a0;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lang-btn.active {
            background-color: #d97706;
            border-color: #d97706;
            color: #fff;
        }

        .lang-btn:hover:not(.active) {
            border-color: #6b6b6b;
            color: #fff;
        }

        
        .section-title {
            margin-bottom: 32px;
        }

        .section-title .label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d97706;
            margin-bottom: 12px;
            display: block;
        }

        .section-title h1 {
            font-size: 3rem;
            font-weight: 400;
            font-style: italic;
            color: #fff;
        }

        .section-description {
            max-width: 480px;
            font-size: 0.875rem;
            color: #6b6b6b;
            text-align: right;
            margin-top: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 32px;
            margin: 48px 0 80px;
        }

        
        .card {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card-image {
            aspect-ratio: 4 / 5;
            background-color: #1a1a1a;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-year {
            font-size: 0.7rem;
            color: #d97706;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #fff;
            margin-bottom: 4px;
        }

        .card-location {
            font-size: 0.7rem;
            color: #6b6b6b;
        }

        
        footer {
            border-top: 1px solid #2a2a2a;
            padding: 40px 0;
            margin-top: 40px;
            text-align: center;
            font-size: 0.7rem;
            color: #4a4a4a;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 20px;
        }

        .footer-links a {
            color: #6b6b6b;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.65rem;
        }

        .footer-links a:hover {
            color: #e5e5e5;
        }

        @media (max-width: 640px) {
            .container {
                padding: 0 16px;
            }
            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }
            .section-title h1 {
                font-size: 2rem;
            }
            .grid {
                gap: 20px;
            }
            .nav {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <div class="header-inner">
            <a href="index.html" class="logo">SeeraLVT_Artworks&nbsp;&nbsp;</a>
            <div class="nav">
                <a href="mailto:seeralvt@gmail.com">seeralvt@gmail.com</a>
                <div class="lang-switch">
                    <button class="lang-btn" data-lang="zh">中</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                </div>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="container">
        <div class="section-title" id="section-title">
            <span class="label" id="section-label">Personal Laboratory</span>
            <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;">
                <h1 id="section-heading">Fan Illustrations.</h1>
                <p class="section-description" id="section-desc">Experimental works, sketches, and subconscious explorations.</p>
            </div>
        </div>

        <div class="grid" id="originals-grid">
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <div class="footer-links">
            <a href="https://x.com/Bilitea1/media">X</a>
            <a href="mailto:seeralvt@gmail.com">Email</a>
        </div>
        <div>©2026 SeeraLVT</div>
    </div>
</footer>

<script>
   
    const WORKS_MULTILINGUAL = [
        {
            id: "ReAlt-Oblog",
            year: "2026",
            image: "img/ReAlt_Star Trail.jpg",
            largeImage: "img/ReAlt_Star Trail.jpg",
            title_zh: "ReAlt-观测记录",
            title_en: "ReAlt - Observation Record",
            location_zh: "动态壁纸",
            location_en: "Dynamic Wallpaper",
            description_zh: "在观测角度对「循环」、「共鸣」与「回溯」的理解。",
            description_en: "Understanding of 'Cycle', 'Resonance' and 'Retrospection' from an observational perspective.",
            fullDescription_zh: "在尽可能还原专辑流线型观感的同时加入了更多破碎、尖锐的元素。<br>创作这张插画时，我认为曲子给我的印象更加偏向硬而光滑，于是主动‘关上了灯’，尽全力把脑海内水晶一般的质感绘制了下来。<br>除此之外，我在创作时结合了‘水波’与‘声波’，以及视角转换等概念。我们站在地球表面，就算理解恒星是什么，但仅凭肉眼观察天空只能看到若隐若现的星点。虽然无法到达，无法看清全貌，但我想，我们可以用自己的方式，将星点连接成线。<br><br>壁纸链接：https://steamcommunity.com/sharedfiles/filedetails/?id=3632506750<br>个人主页：https://x.com/Bilitea1",
            fullDescription_en: "While preserving the streamlined feel of the album as much as possible, more fragmented and sharp elements were added.<br>When creating this illustration, the piece felt hard and smooth to me, so I actively 'turned off the lights' and did my best to capture the crystal-like texture in my mind.<br>In addition, I incorporated concepts like 'water waves', 'sound waves', and perspective shifts. Standing on Earth's surface, even if we understand what stars are, we can only see faint twinkling points with the naked eye. Although we cannot reach them or see the full picture, I believe we can connect those dots in our own way.<br><br>Wallpaper Link: https://steamcommunity.com/sharedfiles/filedetails/?id=3632506750<br>Homepage: https://x.com/Bilitea1"
        },
        {
            id: "Sennoza",
            year: "2023",
            image: "img/Sennoza-black.png",
            largeImage: "img/Sennoza-black.png",
            title_zh: "Sennoza-印象绘",
            title_en: "Sennoza - Impression Drawing",
            location_zh: "插画",
            location_en: "Illustration",
            description_zh: "为还原初见时的惊艳感而作",
            description_en: "Created to recreate the awe of the first encounter.",
            fullDescription_zh: "利用社交软件透明背景的显示机制，希望给人传递‘点开后别有洞天’的观感。",
            fullDescription_en: "Using the transparent background display mechanism of social media, aiming to convey a 'hidden world after clicking' feeling."
        },
        {
            id: "Fervidex",
            year: "2022",
            image: "img/Fervidex1.jpg",
            largeImage: "img/Fervidex1.jpg",
            title_zh: "Fervidex-印象绘",
            title_en: "Fervidex - Impression Drawing",
            location_zh: "插画",
            location_en: "Illustration",
            description_zh: "对听感可视化的新探索",
            description_en: "A new exploration of visualizing listening experience.",
            fullDescription_zh: "看似单色实则色彩纷呈，想要传递这样的感受。",
            fullDescription_en: "Monochrome in appearance but vibrant in essence — wanting to convey that feeling."
        },
        {
            id: "ran",
            year: "2022",
            image: "img/蘭.jpg",
            largeImage: "img/蘭.jpg",
            title_zh: "蘭-印象绘",
            title_en: "Orchid - Impression Drawing",
            location_zh: "插画",
            location_en: "Illustration",
            description_zh: "一时兴起而作。",
            description_en: "Created on a whim.",
            fullDescription_zh: "第一幅为了还原歌曲氛围和情感创作的作品。",
            fullDescription_en: "The first piece created to capture the atmosphere and emotion of a song."
        },
    ];

   
    const STATIC_TRANSLATIONS = {
        zh: {
            sectionLabel: "Personal Laboratory",
            sectionHeading: "二创插画",
            sectionDesc: "实验性作品、草图与潜意识探索。",
        },
        en: {
            sectionLabel: "Personal Laboratory",
            sectionHeading: "Fan Illustrations.",
            sectionDesc: "Experimental works, sketches, and subconscious explorations.",
        }
    };

    let currentLang = localStorage.getItem('seeralvt_lang') || 'zh'; // 默认中文

    // 获取作品当前语言下的显示对象
    function getLocalizedWork(work) {
        const lang = currentLang;
        return {
            id: work.id,
            year: work.year,
            image: work.image,
            largeImage: work.largeImage,
            title: lang === 'zh' ? work.title_zh : work.title_en,
            location: lang === 'zh' ? work.location_zh : work.location_en,
            description: lang === 'zh' ? work.description_zh : work.description_en,
            fullDescription: lang === 'zh' ? work.fullDescription_zh : work.fullDescription_en,
        };
    }

    // 获取所有本地化作品列表
    function getAllLocalizedWorks() {
        return WORKS_MULTILINGUAL.map(work => getLocalizedWork(work));
    }

    // 根据id获取本地化作品
    function getLocalizedWorkById(id) {
        const work = WORKS_MULTILINGUAL.find(w => w.id === id);
        if (!work) return null;
        return getLocalizedWork(work);
    }

    // 渲染首页网格
    function renderGrid() {
        const container = document.getElementById('originals-grid');
        if (!container) return;
        const works = getAllLocalizedWorks();
        container.innerHTML = works.map(work => `
            <a href="detail.html?id=${work.id}" class="card">
                <div class="card-image">
                    <img src="${work.image}" alt="${work.title}" loading="lazy">
                </div>
                <div class="card-year">${work.year}</div>
                <div class="card-title">${work.title}</div>
                <div class="card-location">${work.location}</div>
            </a>
        `).join('');
    }

    // 更新静态文本（首页特有）
    function updateStaticTexts() {
        const t = STATIC_TRANSLATIONS[currentLang];
        if (t) {
            const labelEl = document.getElementById('section-label');
            const headingEl = document.getElementById('section-heading');
            const descEl = document.getElementById('section-desc');
            if (labelEl) labelEl.innerText = t.sectionLabel;
            if (headingEl) headingEl.innerText = t.sectionHeading;
            if (descEl) descEl.innerText = t.sectionDesc;
        }
        // 更新语言按钮激活状态
        document.querySelectorAll('.lang-btn').forEach(btn => {
            const langVal = btn.getAttribute('data-lang');
            if (langVal === currentLang) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    // 切换语言主逻辑
    function setLanguage(lang) {
        if (lang === currentLang) return;
        currentLang = lang;
        localStorage.setItem('seeralvt_lang', lang);
        // 重新渲染动态内容
        renderGrid();
        // 更新静态文本
        updateStaticTexts();
    }

    // 绑定语言切换按钮事件
    function bindLangSwitcher() {
        const btns = document.querySelectorAll('.lang-btn');
        btns.forEach(btn => {
            btn.removeEventListener('click', langHandler);
            btn.addEventListener('click', langHandler);
        });
    }

    function langHandler(e) {
        const lang = e.currentTarget.getAttribute('data-lang');
        if (lang) setLanguage(lang);
    }

    // 初始化页面
    function initIndex() {
        updateStaticTexts();
        renderGrid();
        bindLangSwitcher();
    }

    initIndex();
</script>
</body>
</html>
